# Deploys the workshop key service (provisioner/) to Cloudflare Workers.
# Repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, OPENROUTER_MANAGEMENT_KEY, EVENT_CODE, ADMIN_TOKEN.
# The Worker secrets are set from the repo secrets on each deploy. The KV namespace is made on the first deploy.
name: Deploy key service

on:
  push:
    branches: [main]
    paths:
      - 'provisioner/**'
      - '.github/workflows/deploy-key-service.yml'
  workflow_dispatch:

concurrency:
  group: deploy-key-service
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provisioner
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: provisioner/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check that the repo secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_MANAGEMENT_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_KEY }}
          EVENT_CODE: ${{ secrets.EVENT_CODE }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID OPENROUTER_MANAGEMENT_KEY EVENT_CODE ADMIN_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::The repo secret $name is not set."; missing=1; fi
          done
          exit $missing

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: provisioner
          wranglerVersion: '4.165.0'
          command: deploy
          secrets: |
            OPENROUTER_MANAGEMENT_KEY
            EVENT_CODE
            ADMIN_TOKEN
        env:
          OPENROUTER_MANAGEMENT_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_KEY }}
          EVENT_CODE: ${{ secrets.EVENT_CODE }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      - name: Job summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          COMMAND_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          url="$DEPLOYMENT_URL"
          if [ -z "$url" ]; then
            url=$(printf '%s' "$COMMAND_OUTPUT" | grep -o 'https://[a-zA-Z0-9.-]*\.workers\.dev' | head -1)
          fi
          health=$(curl -s --max-time 20 "$url/health" || true)
          {
            echo "## Key service deployed"
            echo ""
            echo "- URL: **$url**"
            echo "- \`GET /health\`: \`${health:-no answer}\`"
            echo ""
            echo "The Codespace uses this URL: \`containerEnv.WORKSHOP_KEY_URL\` in \`.devcontainer/devcontainer.json\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Key service URL: $url"
