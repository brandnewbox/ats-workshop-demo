# Cloudflare Worker that gives each workshop Codespace its own OpenRouter key.
# No account IDs or secrets here. GitHub Actions (.github/workflows/deploy-key-service.yml) deploys it on a push
# to main and sets the Worker secrets from the repo secrets on each deploy (see README.md):
#   OPENROUTER_MANAGEMENT_KEY   the OpenRouter management key
#   ADMIN_TOKEN                 a long random string, for /admin/keys
#   EVENT_CODE                  the code that Will gives the room (case and spaces do not matter)
name = "ats-workshop-keys"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
KEY_LIMIT_USD = "5"
# Midnight CST at the end of the workshop day (30 Nov). OpenRouter needs seconds in this time.
KEY_EXPIRES_AT = "2026-12-01T06:00:00Z"
KEY_NAME_PREFIX = "ats-workshop-"
# No new keys after this many (the people, plus a few spares).
MAX_KEYS = "60"
# Calls to /key for each GitHub login in an hour.
RATE_LIMIT_PER_HOUR = "10"
# Wrong event codes in an hour, for each GitHub login and for each IP address.
WRONG_CODE_LIMIT_PER_HOUR = "5"

# No id: wrangler creates the namespace "ats-workshop-keys-keys" on the first deploy (automatic resource
# provisioning, also in CI), and later deploys reuse the namespace that the deployed Worker has.
[[kv_namespaces]]
binding = "KEYS"
